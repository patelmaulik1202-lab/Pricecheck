 return`<div class="c"><div class="n">${n.replace(/</g,"&lt;")}</div><div class="s">${cat} · ${c}</div>
 <div class="pr"><div><small>Before tax</small><b>${m(pr)}</b></div><div class="a"><small>After tax</small><b>${m(a)}</b></div></div>
 <div class="t ${t.warn?"w":""}">${t.note}${t.r&&pr?" · tax "+m(a-pr):""}${pr<=0?" · ⚠ price is $0 – check":""}</div></div>`}
function show(raw){const r=find(raw);const h=r.h||[];$("out").innerHTML=h.length?(h.length>1?`<div class="s" style="margin:0 4px 8px">${h.length}${h.length>=30?"+":""} matches</div>`:"")+h.map(card).join(""):`<div class="e">No item found for “${raw.replace(/</g,"&lt;")}”</div>`}
$("q").oninput=e=>{const v=e.target.value;if(v.trim())show(v);else $("out").innerHTML=""};
$("q").onkeydown=e=>{if(e.key=="Enter"){e.target.select()}};
$("prov").onchange=e=>{prov=e.target.value;try{localStorage.prov=prov}catch(x){}if($("q").value.trim())show($("q").value)};
let stream,loop,det,h5,on=false;
function beep(){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function got(code){$("q").value=code;show(code);beep();stop()}
async function stop(){on=false;clearTimeout(loop);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(h5){try{await h5.stop()}catch(e){}h5=null;$("rd").style.display="none"}$("cam").style.display="none";$("sc").textContent="📷 Scan"}
$("sc").onclick=async()=>{if(on)return stop();on=true;$("cam").style.display="block";$("sc").textContent="✕ Stop";$("q").blur();
 try{if("BarcodeDetector"in window){det=det||new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});const v=$("v");v.srcObject=stream;await v.play();
  (async function tick(){if(!on)return;try{const r=await det.detect(v);if(r.length)return got(r[0].rawValue)}catch(e){}loop=setTimeout(tick,150)})()}
 else{await new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  $("v").style.display="none";$("rd").style.display="block";h5=new Html5Qrcode("rd");
  await h5.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},got,()=>{})}
 }catch(e){stop();alert("Live camera is blocked here. Tap the 📸 button next to Scan to take a photo of the barcode instead.")}};
$("ph").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;$("out").innerHTML='<div class="e">Reading photo…</div>';
 try{if("BarcodeDetector"in window){det=det||new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});const r=await det.detect(await createImageBitmap(f));if(r.length)return got(r[0].rawValue)}
 else{await new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});return got(await new Html5Qrcode("rd").scanFile(f,false))}}catch(x){}
 $("out").innerHTML='<div class="e">Couldn’t read the barcode. Retake the photo closer and flat, or type the number.</div>'};
